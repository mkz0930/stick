<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Walk Design A - Thick Vertical Boxes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #0d0d0f;
            color: #e6ebf2;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 32px;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #8e8e93;
        }
        .timeline-wrapper {
            position: relative;
            padding-left: 80px;
            padding-right: 20px;
        }
        .time-markers {
            position: absolute;
            left: 0;
            top: 0;
            width: 70px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 12px;
            color: #636366;
        }
        .timeline-track {
            position: relative;
            width: 8px;
            background: #2c2c2e;
            border-radius: 4px;
            margin-left: 20px;
        }
        .segment {
            position: absolute;
            left: -12px;
            width: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            line-height: 1.2;
        }
        .segment.walk {
            background: #34c759;
            box-shadow: 0 0 12px rgba(52, 199, 89, 0.4);
        }
        .segment.sit {
            background: #ff9500;
        }
        .segment.stand {
            background: #007aff;
        }
        .segment.sleep {
            background: #af52de;
        }
        .walk-indicator {
            position: absolute;
            left: 50px;
            top: 0;
            font-size: 11px;
            color: #34c759;
            white-space: nowrap;
        }
        .legend {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
        .description {
            margin-top: 24px;
            padding: 16px;
            background: #1c1c1e;
            border-radius: 12px;
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.6;
        }
        .description strong {
            color: #34c759;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Direction A: Thick Vertical Boxes</div>
            <div class="subtitle">步行段用加粗竖向矩形方框，宽度更宽，突出步行时长</div>
        </div>

        <div class="timeline-wrapper">
            <div class="time-markers">
                <span>24h前</span>
                <span>18:00</span>
                <span>12:00</span>
                <span>06:00</span>
                <span>现在</span>
            </div>

            <div class="timeline-track" style="height: 600px;">
                <!-- Sleep: 00:00-07:00 -->
                <div class="segment sleep" style="top: 0; height: 29.17%;">睡</div>

                <!-- Walk: 07:00-07:25 (25min) - morning commute -->
                <div class="segment walk" style="top: 29.17%; height: 4.5%;">走<br>25分</div>

                <!-- Sit: 07:25-08:30 -->
                <div class="segment sit" style="top: 33.67%; height: 4.34%;">坐</div>

                <!-- Walk: 08:30-08:45 (15min) -->
                <div class="segment walk" style="top: 37.01%; height: 1.74%;">走</div>

                <!-- Sit: 08:45-12:00 -->
                <div class="segment sit" style="top: 38.75%; height: 16.67%;">坐</div>

                <!-- Walk: 12:00-12:20 (20min) - lunch -->
                <div class="segment walk" style="top: 55.42%; height: 2.31%;">走<br>20分</div>

                <!-- Sit: 12:20-13:30 -->
                <div class="segment sit" style="top: 57.73%; height: 5.56%;">坐</div>

                <!-- Walk: 13:30-13:45 (15min) -->
                <div class="segment walk" style="top: 63.29%; height: 1.74%;">走</div>

                <!-- Sit: 13:45-18:00 -->
                <div class="segment sit" style="top: 65.03%; height: 18.06%;">坐</div>

                <!-- Walk: 18:00-18:15 (15min) - evening commute -->
                <div class="segment walk" style="top: 83.09%; height: 1.74%;">走</div>

                <!-- Stand: 18:15-19:00 -->
                <div class="segment stand" style="top: 84.83%; height: 3.12%;">站</div>

                <!-- Walk: 19:00-19:20 (20min) -->
                <div class="segment walk" style="top: 87.95%; height: 2.31%;">走</div>

                <!-- Stand: 19:20-22:00 -->
                <div class="segment stand" style="top: 90.26%; height: 11.67%;">站</div>

                <!-- Walk: 22:00-22:10 (10min) -->
                <div class="segment walk" style="top: 100.0%; height: 0%;"></div>

                <!-- Sleep: 22:10-24:00 -->
                <div class="segment sleep" style="top: 100.0%; height: 0%;"></div>
            </div>
        </div>

        <div class="description">
            <strong>设计说明：</strong>步行段（绿色）使用 32px 宽的粗竖条，是普通时间线（8px）的 4 倍宽度。步行时长越长，竖条越高，占据的视觉空间越大。通过加粗和发光效果（box-shadow）让步行段在时间线上非常突出。
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: #34c759;"></div>
                <span>走</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #ff9500;"></div>
                <span>坐</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #007aff;"></div>
                <span>站</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #af52de;"></div>
                <span>睡</span>
            </div>
        </div>
    </div>
</body>
</html>
